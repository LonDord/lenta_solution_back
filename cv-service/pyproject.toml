[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lenta-cv"
version = "0.1.0"
description = "Shelf price tag pipeline: YOLO, tracking, best-frame crop for OCR"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.1.0",
    "torch>=2.0.0",
    "lap>=0.5.12",
    "rapidocr-onnxruntime>=1.2.3",
    "onnxruntime>=1.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lenta_cv*"]
